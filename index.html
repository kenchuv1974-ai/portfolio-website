<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Harsh — The Series</title>
    <meta name="description" content="Harsh — Full-Stack Developer and Software Engineer. A cinematic, streaming-inspired portfolio." />
    <meta name="theme-color" content="#07070a" />
    <meta property="og:title" content="Harsh — The Series" />
    <meta property="og:description" content="Full-Stack Developer • AI / ML • Java. Every project is an Original." />
    <meta property="og:image" content="./assets/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="./assets/portrait-720.webp" type="image/webp" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to watch the series.</noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Runtime fallback: if /src/main.tsx does not mount React on static hosting, inject precompiled bundle
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childNodes.length === 0) {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.crossOrigin = 'anonymous';
          l.href = './assets/index.css';
          document.head.appendChild(l);

          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/index.js';
          document.body.appendChild(s);
        }
      }, 100);
    </script>
  </body>
</html>
